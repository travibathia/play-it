<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play It × ETUDE — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
<style>
  :root{
    --pink:#FF6BAA;
    --pink-soft:#FF8EC1;
    --pink-pale:#FFD6E6;
    --maroon:#7B1E3C;
    --purple:#6E42B7;
    --cream:#FFF4F7;
    --white:#FFFFFF;
    --ink:#3A1B2B;
    --shadow: 0 18px 40px -12px rgba(123,30,60,.28);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, #ffe1ee 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #f3d9ff 0%, transparent 45%),
      linear-gradient(160deg, #fff0f5 0%, #ffe4ee 55%, #f8dcee 100%);
    font-family:'Poppins',sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; padding:32px 16px 60px;
  }
  .lab-header{ text-align:center; margin-bottom:22px; }
  .lab-eyebrow{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--maroon); opacity:.6; font-weight:600;}
  .lab-title{ font-family:'Playfair Display',serif; font-weight:800; font-size:30px; color:var(--maroon); margin:4px 0 2px;}
  .lab-title span{ color:var(--pink); }
  .lab-sub{ font-size:12.5px; color:var(--maroon); opacity:.55; max-width:360px; margin:0 auto;}

  .phone{
    width:380px; max-width:94vw; height:800px; max-height:86vh; background:var(--white);
    border-radius:44px; border:10px solid #241019;
    box-shadow:var(--shadow), 0 0 0 2px rgba(255,255,255,.4) inset;
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:22px; background:#241019; border-radius:0 0 16px 16px; z-index:50;}
  .statusbar{ height:38px; flex:none; display:flex; align-items:flex-end; justify-content:space-between; padding:0 22px 6px; font-size:12px; font-weight:600; color:var(--ink); background:var(--cream);}
  .screen{ flex:1; overflow-y:auto; background:var(--cream); position:relative; -ms-overflow-style:none; scrollbar-width:none;}
  .screen::-webkit-scrollbar{ display:none; }
  .pad{ padding:16px 18px 90px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 6px; }
  .topbar h1{ font-family:'Playfair Display',serif; font-size:20px; margin:0; color:var(--maroon); font-weight:700;}
  .brandmark{ display:flex; align-items:center; gap:6px; font-family:'Playfair Display',serif; font-weight:800; color:var(--maroon); font-size:18px;}
  .iconbtn{ width:34px;height:34px;border-radius:50%; background:var(--white); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(123,30,60,.12); border:none; cursor:pointer; color:var(--pink); font-size:15px;}
  .backbtn{ background:none; border:none; font-size:20px; color:var(--maroon); cursor:pointer; padding:4px 8px 4px 0;}
  .micro-header{ text-align:center; padding:10px 0 2px; }
  .micro-brand{ font-size:10.5px; letter-spacing:.1em; color:var(--maroon); opacity:.55; font-weight:700; text-transform:uppercase;}
  .micro-title{ font-family:'Playfair Display',serif; font-weight:800; font-size:19px; color:var(--maroon); margin-top:2px;}
  .photobooth-topbar{ display:flex; align-items:center; justify-content:space-between; padding:6px 16px 8px; }
  .textbtn{ background:none; border:none; color:var(--pink); font-weight:700; font-size:13px; cursor:pointer; }

  .bottomnav{ position:absolute; bottom:0; left:0; right:0; height:66px; background:var(--white); display:flex; align-items:center; justify-content:space-around; box-shadow:0 -6px 18px rgba(123,30,60,.12); z-index:40; border-radius:0 0 34px 34px;}
  .navitem{ display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:#c98aa6; font-size:9px; font-weight:600; }
  .navitem.active{ color:var(--pink); }
  .navicon{ width:19px; height:19px; }
  .navitem.center .navicon-wrap{ width:44px;height:44px;border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--purple)); display:flex; align-items:center; justify-content:center; margin-top:-24px; box-shadow:0 6px 14px rgba(255,107,170,.5);}
  .navitem.center .navicon-wrap svg{ stroke:white; }

  .greeting{ font-family:'Playfair Display',serif; font-size:22px; color:var(--maroon); font-weight:700; margin:6px 0 2px;}
  .greeting-sub{ font-size:12.5px; color:#a15578; margin-bottom:16px;}
  .tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .tab{ flex:1; text-align:center; padding:9px 0; border-radius:20px; font-size:12.5px; font-weight:600; background:var(--white); color:#b57291; cursor:pointer; border:1px solid #ffe0ec; transition:.2s;}
  .tab.active{ background:linear-gradient(135deg,var(--pink),var(--pink-soft)); color:#fff; border-color:transparent; box-shadow:0 6px 14px rgba(255,107,170,.35);}
  .input-card{ background:var(--white); border-radius:20px; padding:14px; box-shadow:0 8px 20px rgba(123,30,60,.08); margin-bottom:14px;}
  .mood-input{ width:100%; border:none; resize:none; font-family:'Poppins',sans-serif; font-size:14px; color:var(--ink); outline:none; min-height:52px; background:transparent;}
  .mood-input::placeholder{ color:#c9a1b6; }
  .genbtn{ width:100%; border:none; padding:14px 0; border-radius:16px; font-weight:700; font-size:14.5px; background:linear-gradient(135deg,var(--pink),#ff4d94); color:#fff; cursor:pointer; box-shadow:0 10px 22px rgba(255,77,148,.4); letter-spacing:.02em;}
  .section-label{ font-size:12px; font-weight:700; color:var(--maroon); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.06em;}
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip{ flex:none; padding:8px 14px; border-radius:14px; background:var(--white); font-size:12px; color:var(--maroon); border:1px solid #ffdcea; cursor:pointer; font-weight:500; white-space:nowrap;}
  .chip:hover{ background:var(--pink-pale); }
  .drop-banner{ margin-top:16px; background:linear-gradient(120deg,var(--purple),#9a5ff0); border-radius:16px; padding:12px 14px; color:#fff; font-size:11.5px; display:flex; align-items:center; justify-content:space-between;}
  .drop-banner b{ font-size:12.5px; display:block; margin-bottom:2px;}
  .trend-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
  .trend-face{ width:96px; height:96px; border-radius:16px; overflow:hidden; box-shadow:0 8px 16px rgba(123,30,60,.15); margin-bottom:6px; flex:none; position:relative;}
  .trend-card{ flex:none; width:96px; text-align:center; }
  .trend-label{ font-size:10.5px; font-weight:600; color:var(--maroon); }
  .upload-badge{ position:absolute; bottom:5px; right:5px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; color:#fff;}
  .upload-badge svg{ width:13px; height:13px; }
  .upload-badge.on-hero{ bottom:12px; right:12px; width:34px; height:34px; }
  .upload-badge.on-hero svg{ width:17px; height:17px; }
  .remove-badge{ position:absolute; top:5px; right:5px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; font-size:11px; line-height:1;}
  .result-face{ position:relative; }

  .result-face{ width:100%; aspect-ratio:1/1; border-radius:24px; overflow:hidden; box-shadow:0 14px 30px rgba(123,30,60,.2); margin-bottom:14px;}
  .look-name{ font-family:'Playfair Display',serif; font-size:22px; color:var(--maroon); font-weight:700; margin:2px 0 4px;}
  .look-desc{ font-size:12.5px; color:#a15578; line-height:1.5; margin-bottom:10px;}
  .tagrow{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .tag{ background:var(--pink-pale); color:var(--maroon); font-size:10.5px; font-weight:600; padding:5px 10px; border-radius:10px;}
  .prod-row{ display:flex; align-items:center; gap:10px; background:var(--white); border-radius:14px; padding:10px 12px; margin-bottom:8px; box-shadow:0 4px 10px rgba(123,30,60,.06);}
  .prod-dot{ width:38px; height:38px; border-radius:8px; flex:none; overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center; border:1px solid #ffe0ec;}
  .prod-dot img{ width:100%; height:100%; object-fit:contain; display:block;}
  .prod-name{ font-size:12.5px; font-weight:600; color:var(--ink);}
  .prod-use{ font-size:10.5px; color:#b57291; }
  .primary-btn{ width:100%; border:none; padding:14px 0; border-radius:16px; font-weight:700; font-size:14px; background:var(--maroon); color:#fff; cursor:pointer; margin-top:6px;}
  .ghost-btn{ width:100%; border:1.5px solid var(--pink); background:transparent; color:var(--pink); padding:12px 0; border-radius:16px; font-weight:600; font-size:13px; cursor:pointer; margin-top:8px;}

  .step-item{ display:flex; gap:12px; background:var(--white); border-radius:16px; padding:12px; margin-bottom:10px; box-shadow:0 4px 12px rgba(123,30,60,.06);}
  .step-num{ width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--purple)); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}
  .step-title{ font-weight:700; font-size:13px; color:var(--maroon); margin-bottom:2px;}
  .step-desc{ font-size:11.5px; color:#a15578; line-height:1.4; margin-bottom:6px;}
  .step-product{ font-size:11px; color:var(--pink); font-weight:600; }

  /* AI Try-On */
  .filter-frame{ width:100%; aspect-ratio:3/4; border-radius:22px; overflow:hidden; margin-bottom:14px; position:relative; box-shadow:0 14px 30px rgba(123,30,60,.25); background:#2a1520;}
  .filter-frame img, .filter-frame video, .filter-frame .filter-art{ width:100%; height:100%; object-fit:cover; display:block;}
  .filter-frame video{ transform:scaleX(-1); }
  .filter-overlay{ position:absolute; inset:0; mix-blend-mode:soft-light; opacity:.55; }
  .filter-badge{ position:absolute; top:12px; left:12px; background:rgba(0,0,0,.45); color:#fff; font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:20px; backdrop-filter:blur(4px);}
  .filter-scanline{ position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,#fff,transparent); opacity:.8; animation:scan 1.8s linear infinite;}
  .filter-zone{ position:absolute; border-radius:50%; mix-blend-mode:multiply; pointer-events:none; }
  .tryon-empty{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:linear-gradient(150deg,#FFE1EE,#F3D9FF); text-align:center; padding:24px;}
  .tryon-empty-title{ font-family:'Playfair Display',serif; font-weight:800; font-size:24px; color:var(--maroon);}
  .tryon-empty-sub{ font-size:12.5px; font-weight:600; color:var(--pink); letter-spacing:.04em;}
  .filter-approx-note{ position:absolute; bottom:10px; left:12px; right:12px; text-align:center; color:#fff; font-size:9px; opacity:.75; background:rgba(0,0,0,.35); border-radius:10px; padding:4px 8px;}
  .track-canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; transform:scaleX(-1); }
  .track-status{ position:absolute; top:12px; right:12px; font-size:9px; font-weight:700; padding:4px 9px; border-radius:20px; color:#fff; background:rgba(0,0,0,.5); backdrop-filter:blur(4px);}
  .track-status.live{ background:rgba(46,160,90,.75); }
  .track-status.loading{ background:rgba(110,66,183,.7); }
  .track-status.approx{ background:rgba(0,0,0,.5); }
  .cam-btn-row{ display:flex; gap:10px; margin-top:2px;}
  .cam-btn-row .ghost-btn, .cam-btn-row label.ghost-btn{ margin-top:0; flex:1; }
  .cam-live-controls{ position:absolute; bottom:14px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:16px;}
  .cam-live-btn{ background:rgba(255,255,255,.9); color:var(--maroon); border:none; padding:10px 18px; border-radius:30px; font-weight:700; font-size:12px; cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.25);}
  .cam-live-btn.cancel{ background:rgba(0,0,0,.5); color:#fff; }
  @keyframes scan{ 0%{top:0} 100%{top:100%} }

  /* Photobooth capture */
  .booth-frame{ width:100%; aspect-ratio:3/4.6; border-radius:26px; overflow:hidden; position:relative; box-shadow:0 16px 34px rgba(123,30,60,.3); background:linear-gradient(160deg,#2a1520,#4a1030);}
  .booth-frame img{ width:100%; height:100%; object-fit:cover; display:block;}
  .booth-hint{ position:absolute; top:16px; left:0; right:0; text-align:center; color:#fff; }
  .booth-hint b{ display:block; font-size:15px; font-weight:700;}
  .booth-hint span{ font-size:11px; opacity:.85;}
  .booth-count{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:64px; border-radius:50%; border:3px solid #fff; color:#fff; font-size:26px; font-weight:800; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.08);}
  .booth-placeholder{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#ffb8d4;}
  .booth-controls{ position:absolute; bottom:14px; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:0 20px;}
  .booth-mini-icon{ width:36px;height:36px;border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer;}
  .booth-capture{ width:58px;height:58px;border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:800; color:var(--pink); font-size:11px; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.3); text-align:center; line-height:1.1;}

  .booth-frame video{ width:100%; height:100%; object-fit:cover; display:block; transform:scaleX(-1);}
  .booth-count{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:88px; height:88px; border-radius:50%; border:4px solid #fff; color:#fff; font-size:44px; font-weight:800; display:flex; align-items:center; justify-content:center; background:rgba(255,107,170,.35); backdrop-filter:blur(2px); animation:countpulse .7s ease-out;}
  @keyframes countpulse{ 0%{transform:translate(-50%,-50%) scale(1.5); opacity:.2;} 100%{transform:translate(-50%,-50%) scale(1); opacity:1;} }
  .booth-flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:20;}
  .booth-flash.fire{ animation:flash .5s ease-out;}
  @keyframes flash{ 0%{opacity:0;} 15%{opacity:.9;} 100%{opacity:0;} }
  .booth-progress{ position:absolute; top:44px; left:0; right:0; display:flex; justify-content:center; gap:7px; z-index:15;}
  .booth-dot{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.4); border:1px solid rgba(255,255,255,.7);}
  .booth-dot.done{ background:#FF6BAA; border-color:#fff;}
  .booth-dot.active{ background:#fff; transform:scale(1.3);}
  .booth-thumbs{ position:absolute; bottom:76px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:15;}
  .booth-thumb{ width:38px; height:38px; border-radius:6px; overflow:hidden; border:2px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.3);}
  .booth-thumb img{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1);}

  /* Photobooth edit / filmstrip */
  .filmstrip-wrap{ display:flex; justify-content:center; margin:4px 0 16px; position:relative; }
  .fs-shot.placeable{ cursor:crosshair; }
  .fs-shot.placeable::after{ content:''; position:absolute; inset:0; border:1.5px dashed rgba(255,255,255,.55); border-radius:4px; pointer-events:none; }
  .placed-sticker{ position:absolute; transform:translate(-50%,-50%); font-size:22px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); cursor:pointer; z-index:4; user-select:none; }
  .sticker-hint{ text-align:center; font-size:10.5px; color:#b57291; margin:-8px 0 10px; }
  .filmstrip{ width:190px; background:var(--pink-pale); border-radius:6px; padding:10px 10px 34px; box-shadow:0 14px 26px rgba(123,30,60,.25); position:relative;}
  .filmstrip.rainbow{ background:linear-gradient(160deg,#ffd6e6,#e8d6ff,#d6f0ff,#fff4d6);}
  .filmstrip.peach{ background:linear-gradient(160deg,#ffe0c2,#ffc2c2);}
  .filmstrip.lavender{ background:linear-gradient(160deg,#e4d6ff,#ffd6ee);}
  .filmstrip.solid{ background:var(--pink);}
  .filmstrip.pattern{ background:repeating-linear-gradient(45deg,#ffe1ee,#ffe1ee 6px,#fff 6px,#fff 12px);}
  .fs-shot{ width:100%; aspect-ratio:1/1; border-radius:4px; overflow:hidden; margin-bottom:8px; box-shadow:0 2px 6px rgba(0,0,0,.15); position:relative;}
  .fs-shot img{ width:100%; height:100%; object-fit:cover; display:block;}
  .fs-tag{ position:absolute; bottom:8px; left:10px; right:10px; background:#fff; border-radius:20px; padding:4px 10px; font-size:9.5px; font-weight:700; color:var(--maroon); text-align:center; box-shadow:0 3px 6px rgba(0,0,0,.15);}
  .fs-logo{ position:absolute; top:8px; right:6px; font-family:'Playfair Display',serif; font-weight:800; color:var(--pink); font-size:11px; background:#fff; border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 6px rgba(0,0,0,.15); transform:rotate(-8deg);}
  .fs-sticker{ position:absolute; font-size:20px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }

  .sticker-row, .bg-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:4px;}
  .sticker-opt{ flex:none; width:44px; height:44px; border-radius:12px; background:var(--white); display:flex; align-items:center; justify-content:center; font-size:19px; cursor:pointer; box-shadow:0 3px 8px rgba(123,30,60,.1); border:2px solid transparent;}
  .sticker-opt.active{ border-color:var(--pink); }
  .bg-opt{ flex:none; width:34px; height:34px; border-radius:50%; cursor:pointer; box-shadow:0 3px 8px rgba(123,30,60,.15); border:2px solid transparent;}
  .bg-opt.active{ border-color:var(--maroon); }
  .bg-opt.frame-swatch{ border-radius:8px; width:26px; height:40px; align-self:center; }
  .name-toggle-row{ display:flex; align-items:center; justify-content:space-between; background:var(--white); border-radius:14px; padding:12px 14px; margin:14px 0 6px; box-shadow:0 4px 10px rgba(123,30,60,.06);}
  .toggle{ width:38px; height:22px; border-radius:20px; background:#e8c4d4; position:relative; cursor:pointer; flex:none;}
  .toggle.on{ background:var(--pink); }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .toggle.on .knob{ left:18px; }
  .name-input{ border:none; background:transparent; font-size:12.5px; font-weight:600; color:var(--maroon); text-align:right; outline:none; width:120px;}

  /* Share screen */
  .share-bg-wrap{ border-radius:26px; padding:20px 0 16px; margin-bottom:6px; background:linear-gradient(135deg,#ffd6e6,#e4d6ff,#d6f0ff,#fff4d6); box-shadow:0 16px 30px rgba(123,30,60,.25);}
  .playcard-wrap{ display:flex; justify-content:center; margin:14px 0 6px; }
  .playcard{
    width:230px; border-radius:16px; padding:16px 14px 14px; position:relative; overflow:hidden;
    box-shadow:0 18px 34px -8px rgba(123,30,60,.4); font-family:'Poppins',sans-serif;
    border:2px solid #D4AF37;
  }
  .playcard::before{
    content:''; position:absolute; inset:6px; border:1px solid rgba(212,175,55,.65); border-radius:10px; pointer-events:none;
  }
  .pc-logo-wrap{ text-align:center; margin-bottom:2px; position:relative; z-index:1;}
  .pc-logo{ font-family:'Playfair Display',serif; font-weight:800; font-style:italic; font-size:22px; letter-spacing:-.01em; }
  .pc-logo .pc-logo-play{ color:#FF6BAA; text-shadow:0 1px 0 rgba(255,255,255,.5);}
  .pc-logo-sub{ font-family:'Playfair Display',serif; font-size:11px; letter-spacing:.08em; margin-top:1px;}
  .playcard .pc-face{ width:100%; aspect-ratio:1/1.12; border-radius:10px; overflow:hidden; margin:8px 0 9px; box-shadow:0 6px 14px rgba(0,0,0,.2); position:relative; z-index:1;}
  .pc-brand{ font-family:'Playfair Display',serif; font-weight:800; font-size:12px; letter-spacing:.05em;}
  .pc-tier{ position:absolute; top:12px; right:12px; font-size:8.5px; font-weight:800; letter-spacing:.08em; padding:4px 9px; border-radius:20px; text-transform:uppercase; z-index:2;}
  .pc-name{ font-weight:800; font-size:14px; margin:2px 0 2px; font-family:'Playfair Display',serif; text-align:center; position:relative; z-index:1;}
  .pc-caption{ font-size:10px; opacity:.9; font-style:italic; margin-bottom:6px; text-align:center; line-height:1.4; font-family:'Playfair Display',serif; position:relative; z-index:1;}
  .pc-rule{ display:flex; align-items:center; justify-content:center; gap:6px; margin:6px 0 4px; position:relative; z-index:1;}
  .pc-rule::before, .pc-rule::after{ content:''; flex:1; height:1px; background:rgba(212,175,55,.6);}
  .pc-meta{ font-size:8px; opacity:.75; display:flex; justify-content:space-between; letter-spacing:.03em; position:relative; z-index:1;}
  .share-row{ display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .share-btn{ width:100%; border:none; padding:13px 0; border-radius:14px; font-weight:700; font-size:12.5px; cursor:pointer;}
  .share-ig{ background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7); color:#fff;}
  .share-tt{ background:#000; color:#fff; }
  .share-save{ background:var(--white); color:var(--maroon); border:1.5px solid var(--pink-pale);}
  .more-opts{ text-align:center; font-size:11px; color:#a15578; margin-top:8px; cursor:pointer; text-decoration:underline;}

  .collection-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mini-card{ border-radius:16px; overflow:hidden; box-shadow:0 6px 14px rgba(123,30,60,.15); cursor:pointer; position:relative; border:1.5px solid #D4AF37; background:#fff;}
  .mini-card .pc-face{ margin:0; border-radius:0; aspect-ratio:1/1.1;}
  .mini-card-img{ width:100%; aspect-ratio:1/1.6; overflow:hidden;}
  .mini-card-img img{ width:100%; height:100%; object-fit:cover; display:block;}
  .mini-tier{ position:absolute; top:6px; right:6px; font-size:7px; font-weight:800; padding:3px 6px; border-radius:20px; text-transform:uppercase; z-index:2;}
  .mini-name{ font-size:10.5px; font-weight:700; padding:6px 8px 8px; color:var(--maroon); text-align:center;}
  .empty-state{ text-align:center; padding:60px 20px; color:#c48ba8; font-size:13px; }
  .empty-state svg{ width:50px; height:50px; margin-bottom:10px; opacity:.5;}
  .toast{ position:absolute; bottom:78px; left:50%; transform:translateX(-50%); background:var(--maroon); color:#fff; padding:10px 18px; border-radius:30px; font-size:12px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s; z-index:80; white-space:nowrap;}
  .toast.show{ opacity:1; bottom:88px; }
  .below-note{ max-width:380px; margin-top:20px; text-align:center; font-size:11px; color:#a15578; opacity:.8; line-height:1.6;}

  /* ---------- GACHA REVEAL ---------- */
  .gacha-stage{ position:relative; min-height:360px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:8px 0 14px; }
  /* build-up */
  .gacha-pre{ position:relative; width:100%; height:340px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  .gacha-orb{ position:relative; width:120px; height:120px; display:flex; align-items:center; justify-content:center; }
  .gacha-orb-core{ width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #fff, var(--glow) 70%); display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; box-shadow:0 0 30px 8px var(--glow); animation:orbPulse 1.1s ease-in-out infinite; }
  @keyframes orbPulse{ 0%,100%{ transform:scale(1); box-shadow:0 0 26px 6px var(--glow);} 50%{ transform:scale(1.14); box-shadow:0 0 44px 14px var(--glow);} }
  .gacha-ring{ position:absolute; inset:0; border:3px solid var(--glow); border-radius:50%; opacity:.5; animation:ringExpand 1.6s ease-out infinite; }
  .gacha-ring.r2{ animation-delay:.8s; }
  @keyframes ringExpand{ 0%{ transform:scale(.5); opacity:.7;} 100%{ transform:scale(1.8); opacity:0;} }
  .gacha-spark{ position:absolute; top:50%; left:50%; width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 8px 2px var(--glow); animation:sparkFly 1.5s ease-out infinite; animation-delay:calc(var(--i) * 0.09s); }
  .gacha-spark.s0{ background:#FFD6E6;} .gacha-spark.s1{ background:#E8D6FF;} .gacha-spark.s2{ background:#FFF4D6;} .gacha-spark.s3{ background:#D6F0FF;} .gacha-spark.s4{ background:#fff;} .gacha-spark.s5{ background:#FFB8D4;} .gacha-spark.s6{ background:#C9AFEE;}
  @keyframes sparkFly{ 0%{ transform:translate(-50%,-50%) rotate(calc(var(--i) * 51deg)) translateX(0) scale(0); opacity:1;} 70%{ opacity:1;} 100%{ transform:translate(-50%,-50%) rotate(calc(var(--i) * 51deg)) translateX(120px) scale(1); opacity:0;} }
  .gacha-label{ margin-top:20px; font-family:'Playfair Display',serif; font-weight:700; color:var(--maroon); font-size:15px; animation:labelBlink 1.2s ease-in-out infinite; }
  @keyframes labelBlink{ 0%,100%{opacity:.6;} 50%{opacity:1;} }
  .gacha-tap{ margin-top:12px; border:1.5px solid var(--pink); background:rgba(255,255,255,.7); color:var(--pink); font-weight:700; font-size:12px; padding:8px 18px; border-radius:20px; cursor:pointer; }

  /* reveal */
  .card-reveal{ position:relative; width:100%; display:flex; flex-direction:column; align-items:center; animation:revealPop .6s cubic-bezier(.2,1.2,.4,1); }
  @keyframes revealPop{ 0%{ transform:scale(.6) rotateY(40deg); opacity:0;} 60%{ transform:scale(1.05) rotateY(-6deg); opacity:1;} 100%{ transform:scale(1) rotateY(0);} }
  .card-rays{ position:absolute; top:40%; left:50%; width:360px; height:360px; transform:translate(-50%,-50%); background:conic-gradient(from 0deg, transparent 0 8deg, rgba(255,255,255,.5) 8deg 12deg, transparent 12deg 24deg); border-radius:50%; opacity:.5; animation:raysSpin 9s linear infinite; z-index:0; }
  .rarity-rare .card-rays{ background:conic-gradient(from 0deg, transparent 0 6deg, rgba(154,95,240,.55) 6deg 10deg, transparent 10deg 20deg); }
  .rarity-limited .card-rays{ background:conic-gradient(from 0deg, transparent 0 6deg, rgba(240,192,90,.55) 6deg 10deg, transparent 10deg 20deg); }
  @keyframes raysSpin{ 0%{transform:translate(-50%,-50%) rotate(0);} 100%{transform:translate(-50%,-50%) rotate(360deg);} }
  .reveal-star{ position:absolute; top:20%; left:50%; color:#fff; font-size:14px; text-shadow:0 0 6px var(--glow); animation:starburst 1.1s ease-out forwards; animation-delay:calc(.2s + var(--i) * 0.05s); z-index:1; opacity:0; }
  .reveal-star.rs0{color:#FFD6E6;} .reveal-star.rs1{color:#E8D6FF;} .reveal-star.rs2{color:#FFF4D6;} .reveal-star.rs3{color:#D6F0FF;} .reveal-star.rs4{color:#fff;}
  @keyframes starburst{ 0%{ transform:translate(-50%,-50%) rotate(calc(var(--i)*72deg)) translateX(0) scale(0); opacity:1;} 100%{ transform:translate(-50%,-50%) rotate(calc(var(--i)*72deg)) translateX(150px) scale(1.2); opacity:0;} }
  .realcard-wrap{ position:relative; width:210px; border-radius:16px; overflow:hidden; box-shadow:0 18px 40px -8px rgba(123,30,60,.45), 0 0 26px 2px var(--glow); z-index:2; }
  .rarity-rare .realcard-wrap{ animation:rareFloat 3s ease-in-out infinite; }
  @keyframes rareFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .realcard-img{ width:100%; display:block; }
  .realcard-shine{ position:absolute; top:0; left:-60%; width:50%; height:100%; background:linear-gradient(105deg, transparent, rgba(255,255,255,.65), transparent); transform:skewX(-18deg); animation:shineSweep 2.6s ease-in-out infinite; animation-delay:.6s; }
  @keyframes shineSweep{ 0%{ left:-60%;} 40%,100%{ left:130%;} }
  .rarity-badge{ position:absolute; top:10px; left:10px; z-index:3; font-size:9px; font-weight:800; letter-spacing:.06em; padding:4px 10px; border-radius:20px; text-transform:uppercase; box-shadow:0 3px 8px rgba(0,0,0,.25); }
  .card-name-line{ margin-top:14px; font-family:'Playfair Display',serif; font-weight:800; font-size:17px; color:var(--maroon); z-index:2; }
  .card-caption-line{ margin-top:4px; font-family:'Playfair Display',serif; font-style:italic; font-size:11.5px; color:#a15578; text-align:center; max-width:230px; line-height:1.45; z-index:2; }
</style>

// Map any product name variant (shade/edition suffixes) to its base product image
function productImage(name){
  const n = (name||'').toLowerCase();
  if(n.includes('curl fix')) return PRODUCT_IMAGES['curl-fix'];
  if(n.includes('play color eyes') || n.includes('petit palette') || n.includes('palette')) return PRODUCT_IMAGES['play-color-eyes'];
  if(n.includes('ginger sugar')) return PRODUCT_IMAGES['ginger-sugar'];
  if(n.includes('soonjung') || n.includes('emulsion')) return PRODUCT_IMAGES['soonjung'];
  if(n.includes('water tint') || n.includes('dear darling')) return PRODUCT_IMAGES['water-tint'];
  return null;
}

/* ---------------- HELPERS: matching ---------------- */
function expandWithSynonyms(text){
  let expanded = text;
  Object.keys(SYNONYMS).forEach(key=>{
    if(text.includes(key)) expanded += ' ' + SYNONYMS[key];
  });
  return expanded;
}

function matchLook(text){
  const t = expandWithSynonyms(text.toLowerCase());
  let bestScore = 0;
  let candidates = [];
  LOOKS.forEach(l=>{
    let score = 0;
    l.keywords.forEach(k=>{ if(t.includes(k)) score += 2; });
    l.tags.forEach(tag=>{ if(t.includes(tag.toLowerCase())) score += 1; });
    if(t.includes(l.name.toLowerCase())) score += 3;
    if(score > bestScore){ bestScore = score; candidates = [l]; }
    else if(score === bestScore && score > 0){ candidates.push(l); }
  });
  if(candidates.length === 0){
    return LOOKS[Math.floor(Math.random()*LOOKS.length)];
  }
  return candidates[Math.floor(Math.random()*candidates.length)];
}

/* pull a Play Card — random gacha from the 3 cards, with a rarity shine feel */
function pickCard(){
  const card = CARDS[Math.floor(Math.random()*CARDS.length)];
  // rarity shine: mostly Common, sometimes Rare (drives the reveal glow)
  const roll = Math.random();
  let rarity;
  if(roll < 0.08) rarity = 'Rare';
  else if(roll < 0.28) rarity = 'Limited';
  else rarity = 'Common';
  return {card, rarity};
}

function glitterDots(){

function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

function nav(screen){
  if(screen !== 'aitryon') { stopCameraStream(); }
  if(screen !== 'photobooth-capture') { stopBoothCamera(); }
  state.screen = screen;
  render();
}

/* ---------------- CAMERA + FACE TRACKING ---------------- */
function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Camera not supported in this browser');
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false})
    .then(stream=>{
      activeCameraStream = stream;
      state.cameraActive = true;
      faceTrackState = 'loading';
      render();
      startFaceTracking();
    })
    .catch(()=>{
      toast('Camera access denied or unavailable');
    });
}

function stopCameraStream(){
  stopFaceTracking();
  if(activeCameraStream){
    activeCameraStream.getTracks().forEach(t=>t.stop());
    activeCameraStream = null;
  }
  state.cameraActive = false;
  faceTrackState = 'idle';
  lastLandmarks = null;
}

/* --- MediaPipe FaceMesh setup --- */
function startFaceTracking(){
  // If the library never loaded (offline / blocked), fall back to approximate zones.
  if(typeof FaceMesh === 'undefined'){
    faceTrackState = 'approx';
    updateTrackStatus();
    return;
  }
  try{
    if(!faceMeshInstance){
      faceMeshInstance = new FaceMesh({
        locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`
      });
      faceMeshInstance.setOptions({
        maxNumFaces:1,
        refineLandmarks:true,
        minDetectionConfidence:0.5,
        minTrackingConfidence:0.5
      });
      faceMeshInstance.onResults(onFaceResults);
    }
    pumpFrames();
  }catch(e){
    faceTrackState = 'approx';
    updateTrackStatus();
  }
}

function pumpFrames(){
  const video = document.getElementById('cameraPreview');
  if(!state.cameraActive || !video){ return; }
  const loop = async ()=>{
    if(!state.cameraActive){ return; }
    const v = document.getElementById('cameraPreview');
    if(v && v.readyState >= 2 && faceMeshInstance){
      try{ await faceMeshInstance.send({image:v}); }
      catch(e){ /* transient frame error, keep going */ }
    }
    faceTrackRAF = requestAnimationFrame(loop);
  };
  faceTrackRAF = requestAnimationFrame(loop);
}

function stopFaceTracking(){
  if(faceTrackRAF){ cancelAnimationFrame(faceTrackRAF); faceTrackRAF = null; }
}

function onFaceResults(results){
  const canvas = document.getElementById('trackCanvas');
  if(!canvas){ return; }
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('cameraPreview');
  if(video && video.videoWidth){
    if(canvas.width !== video.videoWidth){ canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(results.multiFaceLandmarks && results.multiFaceLandmarks.length){
    lastLandmarks = results.multiFaceLandmarks[0];
    if(faceTrackState !== 'live'){ faceTrackState = 'live'; updateTrackStatus(); }
    drawMakeup(ctx, lastLandmarks, canvas.width, canvas.height, state.currentLook);
  } else {
    // face temporarily lost — keep status but clear paint
    if(faceTrackState === 'loading'){ faceTrackState = 'live'; updateTrackStatus(); }
  }
}

/* Landmark index groups from MediaPipe FaceMesh (468 pts) */
const LM = {
  lipsOuter:[61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185],
  leftEye:[33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7],
  rightEye:[362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382],
  leftCheek:[205,50,101,118,117,111],
  rightCheek:[425,280,330,347,346,340]
};

/* iOS Safari's canvas ignores ctx.filter, which made makeup render as hard-edged
   shapes on mobile. Detect support once and fall back to a shadow-blur technique. */
const CANVAS_FILTER_OK = (function(){
  try{
    const c = document.createElement('canvas').getContext('2d');
    c.filter = 'blur(2px)';
    return c.filter === 'blur(2px)';
  }catch(e){ return false; }
})();

/* Draws a path softly on any browser.
   - Modern desktop: native ctx.filter blur.
   - iOS/Safari fallback: draw the shape far off-canvas and project it back via a
     blurred shadow, which IS hardware-supported everywhere. */
function softFill(ctx, pathFn, color, alpha, blur, w){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = color;
  if(!blur){
    ctx.beginPath(); pathFn(ctx, 0); ctx.fill();
    ctx.restore();
    return;
  }
  if(CANVAS_FILTER_OK){
    ctx.filter = `blur(${blur}px)`;
    ctx.beginPath(); pathFn(ctx, 0); ctx.fill();
  } else {
    const OFF = (w || 2000) + 3000;      // push the real shape well off-canvas
    ctx.shadowColor = color;
    ctx.shadowBlur = blur * 2.2;          // shadow blur reads softer than filter blur
    ctx.shadowOffsetX = OFF;              // project the blurred copy back into place
    ctx.shadowOffsetY = 0;
    ctx.beginPath(); pathFn(ctx, -OFF); ctx.fill();
  }
  ctx.restore();
}

function fillPoly(ctx, lm, idxs, w, h, color, alpha, blur){
  softFill(ctx, (c, dx)=>{
    idxs.forEach((id,i)=>{
      const p = lm[id];
      const x = p.x*w + dx, y = p.y*h;
      if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
    });
    c.closePath();
  }, color, alpha, blur, w);
}

function eyeLidPoly(ctx, lm, eyeIdxs, w, h, color, alpha){
  // paint a soft band just above the eye for a lid-shadow effect
  softFill(ctx, (c, dx)=>{
    const pts = eyeIdxs.map(id=>({x:lm[id].x*w + dx, y:lm[id].y*h}));
    pts.forEach((p,i)=>{ const y = p.y - (h*0.028); if(i===0) c.moveTo(p.x,y); else c.lineTo(p.x,y); });
    for(let i=pts.length-1;i>=0;i--){ c.lineTo(pts[i].x, pts[i].y); }
    c.closePath();
  }, color, alpha, 3, w);
}

function drawMakeup(ctx, lm, w, h, look){
  if(!look) return;
  const c = look.colors;
  // lips
  fillPoly(ctx, lm, LM.lipsOuter, w, h, c.lip, 0.5, 2);
  // eyelids
  eyeLidPoly(ctx, lm, LM.leftEye, w, h, c.eye, 0.45);
  eyeLidPoly(ctx, lm, LM.rightEye, w, h, c.eye, 0.45);
  // cheeks — radial gradients give a genuinely soft, feathered edge on every
  // browser without relying on any blur filter at all.
  [LM.leftCheek, LM.rightCheek].forEach(group=>{
    let cx=0, cy=0; group.forEach(id=>{ cx+=lm[id].x; cy+=lm[id].y; });
    cx = (cx/group.length)*w; cy = (cy/group.length)*h;
    const rx = w*0.085, ry = h*0.06;
    const r = Math.max(rx, ry);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0,    hexToRgba(c.cheek, 0.42));
    grad.addColorStop(0.45, hexToRgba(c.cheek, 0.26));
    grad.addColorStop(0.75, hexToRgba(c.cheek, 0.10));
    grad.addColorStop(1,    hexToRgba(c.cheek, 0));
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

function hexToRgba(hex, a){
  const m = String(hex).replace('#','');
  const full = m.length===3 ? m.split('').map(x=>x+x).join('') : m;
  const n = parseInt(full,16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${a})`;
}

function updateTrackStatus(){
  const el = document.getElementById('trackStatus');
  if(!el) return;
  el.className = 'track-status ' + (faceTrackState==='live'?'live':faceTrackState==='loading'?'loading':'approx');
  el.textContent = faceTrackState==='live' ? '● Face tracked'

}

function captureFromCamera(){
  const video = document.getElementById('cameraPreview');
  if(!video || !video.videoWidth){ toast('Camera still loading, try again'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  // mirror to match the selfie preview
  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  // bake the tracked makeup overlay onto the capture if we have landmarks
  if(lastLandmarks && faceTrackState === 'live'){
    drawMakeup(ctx, lastLandmarks, canvas.width, canvas.height, state.currentLook);
    state.captureWasTracked = true;
  } else {
    state.captureWasTracked = false;
  }
  ctx.restore();
  state.photoDataUrl = canvas.toDataURL('image/png');
  stopCameraStream();
  render();
}

function attachCameraPreview(){
  if(state.screen === 'aitryon' && state.cameraActive && activeCameraStream){
    const video = document.getElementById('cameraPreview');
    if(video && video.srcObject !== activeCameraStream){
      video.srcObject = activeCameraStream;
      video.onloadedmetadata = ()=>{ video.play().catch(()=>{}); updateTrackStatus(); };
    }
    updateTrackStatus();
  }
  // Booth camera preview
  if(state.screen === 'photobooth-capture' && state.boothCameraActive && activeCameraStream){
    const bv = document.getElementById('boothPreview');
    if(bv){
      // ensure inline playback attributes (iOS Safari requirement)
      bv.setAttribute('playsinline','');
      bv.setAttribute('webkit-playsinline','');
      bv.muted = true;
      if(bv.srcObject !== activeCameraStream){
        bv.srcObject = activeCameraStream;
        bv.onloadedmetadata = ()=>{ bv.play().catch(()=>{}); };
      }
      // render() rebuilds this element every tick; mobile pauses re-inserted videos,
      // so re-issue play() each time to keep frames flowing during the countdown.
      bv.play().catch(()=>{});
    }
  }
}

/* ---------------- PHOTOBOOTH CAMERA ---------------- */
function startBoothCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Camera not supported — upload 4 photos instead');
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false})
    .then(stream=>{
      activeCameraStream = stream;
      state.boothCameraActive = true;
      state.shots = [];
      state.boothShotIndex = 0;
      render();
    })
    .catch(()=> toast('Camera access denied — upload 4 photos instead'));
}

function stopBoothCamera(){
  if(activeCameraStream){
    activeCameraStream.getTracks().forEach(t=>t.stop());
    activeCameraStream = null;
  }
  state.boothCameraActive = false;
  state.boothCapturing = false;
  state.countingDown = false;
}

function grabBoothShot(){
  const v = document.getElementById('boothPreview');
  if(!v || !v.videoWidth || !v.videoHeight) return null;
  // center-square crop from the video
  const side = Math.min(v.videoWidth, v.videoHeight);
  const sx = (v.videoWidth - side)/2, sy = (v.videoHeight - side)/2;
  const canvas = document.createElement('canvas');
  canvas.width = 480; canvas.height = 480;
  const ctx = canvas.getContext('2d');
  try {
    ctx.drawImage(v, sx, sy, side, side, 0, 0, 480, 480);
    return canvas.toDataURL('image/jpeg', 0.82);
  } catch(e){
    return null;
  }
}

// Try to grab a frame, retrying briefly if the video isn't ready yet (mobile).
// Always calls done(shot) — shot may be a fallback if the camera never produced a frame.
function grabBoothShotWhenReady(done, attempt){
  attempt = attempt || 0;
  const shot = grabBoothShot();
  if(shot){ done(shot); return; }
  if(attempt >= 12){ // ~1.8s of retries, then give up gracefully
    // fallback: reuse the last shot, or a neutral placeholder, so the flow never stalls
    const fallback = state.shots.length ? state.shots[state.shots.length-1] : PLACEHOLDER_SHOT;
    done(fallback);
    return;
  }
  setTimeout(()=> grabBoothShotWhenReady(done, attempt+1), 150);
}

// 1x1 transparent-ish neutral placeholder (only used if the camera never yields a frame)
const PLACEHOLDER_SHOT = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480"><rect width="480" height="480" fill="#ffd6e6"/><text x="240" y="250" font-size="28" fill="#7B1E3C" text-anchor="middle" font-family="sans-serif">Play It</text></svg>');

function runBoothSequence(){
  if(state.boothCapturing) return;
  state.boothCapturing = true;

  const captureOne = ()=>{
    if(!state.boothCameraActive){ state.boothCapturing = false; return; }
    // 3-2-1 countdown, then snap
    state.countingDown = true;
    state.countdownVal = 3;
    render();

    const tick = ()=>{
      // guard: sequence may have been cancelled (nav away) mid-countdown
      if(!state.boothCapturing || !state.boothCameraActive) return;
      state.countdownVal -= 1;
      if(state.countdownVal <= 0){
        state.countingDown = false;
        const flash = document.getElementById('boothFlash');
        if(flash){ flash.classList.add('fire'); }
        // Grab a frame — retry until the video is producing frames (mobile safety),
        // then ALWAYS advance so we can never loop forever.
        grabBoothShotWhenReady((shot)=>{
          if(!state.boothCapturing) return; // cancelled while waiting
          state.shots.push(shot);
          // hard cap: never exceed 4
          if(state.shots.length > 4) state.shots = state.shots.slice(0,4);
          render();
          if(state.shots.length >= 4){
            state.boothCapturing = false;
            stopBoothCamera();
            setTimeout(()=>{ if(state.screen==='photobooth-capture') nav('photobooth-edit'); }, 500);
          } else {
            setTimeout(captureOne, 900);
          }
        });
      } else {
        render();
        setTimeout(tick, 800);
      }
    };
    setTimeout(tick, 800);
  };
  captureOne();
}

    <span style="width:26px;">⚡</span>
  </div>
  <div class="pad" style="padding-top:6px;">
    <div class="booth-frame">
      ${state.boothCameraActive ? `
        <video id="boothPreview" autoplay playsinline webkit-playsinline muted></video>
        <div class="booth-flash" id="boothFlash"></div>
        <div class="booth-progress">
          ${[0,1,2,3].map(i=>`<div class="booth-dot ${i<shotsTaken?'done':i===shotsTaken&&state.boothCapturing?'active':''}"></div>`).join('')}
        </div>
        ${state.countingDown ? `<div class="booth-count">${state.countdownVal}</div>` : `
          <div class="booth-hint"><b>${shotsTaken===0?'Strike a pose!':'Shot '+(shotsTaken+1)+' of 4'}</b><span>${state.boothCapturing?'Hold still…':'Tap Play It to start all 4 ✧'}</span></div>`}
        ${shotsTaken? `<div class="booth-thumbs">${state.shots.map(s=>`<div class="booth-thumb"><img src="${s}"></div>`).join('')}</div>`:''}
        <div class="booth-controls">
          <div class="booth-mini-icon" id="boothCancelBtn">✕</div>
          <div class="booth-capture" id="boothStartSeqBtn" style="${state.boothCapturing?'opacity:.5;pointer-events:none;':''}">Play<br>It</div>
          <div class="booth-mini-icon">${ICONS.flip}</div>
        </div>
      ` : state.shots.length ? `
        <div style="width:100%;height:100%;display:flex;flex-direction:column;gap:4px;padding:8px;">
          ${state.shots.map(s=>`<div style="flex:1;border-radius:8px;overflow:hidden;"><img src="${s}" style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1);"></div>`).join('')}
        </div>
        <div class="booth-controls">
          <div class="booth-mini-icon" id="boothRetakeBtn">↺</div>
          <div class="booth-capture" id="boothDoneBtn" style="font-size:9px;">Next<br>→</div>
          <div style="width:36px;"></div>
        </div>
      ` : `
        <div class="booth-placeholder">${ICONS.cam}<div style="font-size:11.5px;margin-top:6px;">Tap below to start</div></div>
        <div class="booth-hint"><b>Strike a pose!</b><span>We'll capture 4 cute shots ✧</span></div>
        <div class="booth-controls">
          <label class="booth-mini-icon">${ICONS.gallery}<input type="file" accept="image/*" multiple id="boothPhotoInput" style="display:none;"></label>
          <div class="booth-capture" id="boothUseCameraBtn">Play<br>It</div>
          <div class="booth-mini-icon">${ICONS.flip}</div>
        </div>
      `}
    </div>
    ${!state.boothCameraActive && !state.shots.length ? `<p style="font-size:10.5px;color:#b57291;text-align:center;margin-top:10px;">Tap <b>Play It</b> to use your camera, or the gallery icon to upload 4 photos.</p>`:''}
  </div>`;
}


function stripClass(bg){
  return {solid:'solid', pattern:'pattern', peach:'peach', rainbow:'rainbow', lavender:'lavender'}[bg] || 'rainbow';
}

function filmstripHTML(compact){
  const shots = state.shots.length ? state.shots : (state.photoDataUrl ? [state.photoDataUrl,state.photoDataUrl,state.photoDataUrl,state.photoDataUrl] : []);
  const label = state.nameOn ? (state.customLookName || state.currentLook.name) : '';
  const perShotFilters = ['none','saturate(1.15)','brightness(1.05) contrast(1.03)','saturate(1.1) brightness(1.02)'];
  const placeable = !compact && state.screen === 'photobooth-edit';
  return `
  <div class="filmstrip ${stripClass(state.selectedBg)}" style="${compact?'width:150px;':''}">
    ${[0,1,2,3].map(i=>`
      <div class="fs-shot ${placeable?'placeable':''}" ${placeable?`data-shotidx="${i}"`:''}>
        ${shots[i] ? `<img src="${shots[i]}" style="filter:${perShotFilters[i]};">` : `<div style="width:100%;height:100%;background:linear-gradient(135deg,#ffe1ee,#f3d9ff);"></div>`}
        ${i===0 ? `<div class="fs-logo">P</div>` : ''}
        ${state.placedStickers.filter(s=>s.shot===i).map((s,si)=>`
          <span class="placed-sticker" data-stickeridx="${state.placedStickers.indexOf(s)}" style="left:${s.x}%;top:${s.y}%;">${s.emoji}</span>`).join('')}
      </div>`).join('')}
    ${label ? `<div class="fs-tag">${label} ✦</div>` : ''}
  </div>`;
}

function photoboothEditScreen(){
  return `
  <div class="photobooth-topbar">
    <button class="backbtn" onclick="nav('photobooth-capture')">←</button>
    <div style="text-align:center;"><div class="micro-brand">ETUDE × Play It</div><div class="micro-title" style="font-size:16px;">Play It Photobooth</div></div>
    <button class="textbtn" id="saveStripBtn">Save</button>
  </div>
  <div class="pad" style="padding-top:6px;">
    <div class="filmstrip-wrap">${filmstripHTML(false)}</div>
    <div class="sticker-hint">${state.selectedSticker ? `Tap a photo to place ${state.selectedSticker} · tap a sticker to remove it` : 'Pick a sticker below, then tap a photo to place it'}</div>

    <div class="section-label">Stickers</div>
    <div class="sticker-row">
      ${STICKERS.map(s=>`<div class="sticker-opt ${state.selectedSticker===s?'active':''}" data-sticker="${s}">${s}</div>`).join('')}
      ${state.placedStickers.length ? `<div class="sticker-opt" id="clearStickersBtn" title="Clear all stickers" style="font-size:13px;font-weight:700;color:var(--pink);">clear</div>` : ''}
    </div>

    <div class="section-label">Background</div>
    <div class="bg-row">
      ${BACKGROUNDS.map(b=>{
        const bgcss = b.id==='solid'?'background:var(--pink);':b.id==='peach'?'background:linear-gradient(135deg,#ffe0c2,#ffc2c2);':b.id==='lavender'?'background:linear-gradient(135deg,#e4d6ff,#ffd6ee);':b.id==='pattern'?'background:repeating-linear-gradient(45deg,#ffe1ee,#ffe1ee 4px,#fff 4px,#fff 8px);':'background:linear-gradient(135deg,#ffd6e6,#e4d6ff,#d6f0ff,#fff4d6);';
        return `<div class="bg-opt ${stripClass(b.id)} ${state.selectedBg===b.id?'active':''}" data-bg="${b.id}" style="${bgcss}"></div>`;
      }).join('')}
    </div>

    <div class="name-toggle-row">
      <span style="font-size:12.5px;font-weight:600;color:var(--maroon);">Add look name</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="toggle ${state.nameOn?'on':''}" id="nameToggle"><div class="knob"></div></div>
        <input class="name-input" id="lookNameInput" value="${state.customLookName || state.currentLook.name}" ${state.nameOn?'':'disabled'}>
      </div>
    </div>
  </div>`;
}

function shareScreen(){
  const card = state.currentCard;
  const rs = RARITY_STYLE[card.rarity];
  const cardImg = CARD_IMAGES[card.card.id];
  const revealing = state.cardRevealing;
  return `
  <div class="photobooth-topbar">
    <button class="backbtn" onclick="nav('photobooth-edit')">←</button>
    <div style="text-align:center;"><div class="micro-brand">ETUDE × Play It</div><div class="micro-title" style="font-size:16px;">Share Your Moment</div></div>
    <span style="width:26px;">🏠</span>
  </div>
  <div class="pad" style="padding-top:6px;" id="shareCaptureArea">
    <div class="share-bg-wrap ${stripClass(state.selectedBg)}">
      <div class="filmstrip-wrap">${filmstripHTML(false)}</div>
    </div>

    <!-- GACHA REVEAL STAGE -->
    <div class="gacha-stage" id="gachaStage" style="--glow:${rs.glow};">
      ${revealing ? `
        <div class="gacha-pre" id="gachaPre">
          <div class="gacha-orb">
            <div class="gacha-orb-core">✦</div>
            <div class="gacha-ring"></div>
            <div class="gacha-ring r2"></div>
          </div>
          ${Array.from({length:14}).map((_,i)=>`<span class="gacha-spark s${i%7}" style="--i:${i};"></span>`).join('')}
          <div class="gacha-label">Your Play It Card is ready…</div>
          <button class="gacha-tap" id="gachaTapBtn">Tap to reveal ✦</button>
        </div>
      ` : `
        <div class="card-reveal rarity-${card.rarity.toLowerCase()}">
          <div class="card-rays"></div>
          ${Array.from({length:10}).map((_,i)=>`<span class="reveal-star rs${i%5}" style="--i:${i};">✦</span>`).join('')}
          <div class="realcard-wrap">
            <div class="rarity-badge" style="background:${rs.badge};color:${rs.badgeText};">${rs.label}</div>
            <img class="realcard-img" src="${cardImg}" alt="${card.card.name}">
            <div class="realcard-shine"></div>
          </div>
          <div class="card-name-line">✦ ${card.card.name} ✦</div>
          <div class="card-caption-line">${card.card.caption}</div>
        </div>
      `}
    </div>

    ${revealing ? '' : `
    <div class="share-row">
      <button class="share-btn share-ig" id="igBtn">📷 Post to Instagram</button>
      <button class="share-btn share-tt" id="ttBtn">🎵 Post to TikTok</button>
      <button class="share-btn share-save" id="saveBtn">⬇ Save to Gallery</button>
    </div>
    <div class="more-opts" id="moreOptsBtn">More Options</div>
    <button class="ghost-btn" onclick="resetToHome()">Play It Again</button>
    `}
  </div>`;
}

function looksScreen(){
  return `
  <div class="topbar"><h1>Looks</h1><span></span></div>
  <div class="pad" style="padding-top:6px;">
    ${state.collection.length===0 ? `
      <div class="empty-state">${ICONS.emptycard}<div>No looks yet.<br>Generate one from Home to start your collection.</div></div>
    ` : `
      <div class="collection-grid">
        ${state.collection.slice().reverse().map((c,i)=>{
          const rs = RARITY_STYLE[c.card.rarity];
          const cardImg = CARD_IMAGES[c.card.card.id];
          return `
          <div class="mini-card" onclick='viewShare(${state.collection.length-1-i})'>
            <div class="mini-tier" style="background:${rs.badge}; color:${rs.badgeText};">${rs.label}</div>
            <div class="mini-card-img"><img src="${cardImg}" alt="${c.card.card.name}"></div>
            <div class="mini-name">✦ ${c.card.card.name} ✦<br><span style="font-weight:500;opacity:.7;font-size:9px;">${c.look.name}</span></div>
          </div>`;
        }).join('')}
      </div>
    `}
  </div>`;
}

function myPageScreen(){
  const commonCount = state.collection.filter(c=>c.card.rarity==='Common').length;
  const limitedCount = state.collection.filter(c=>c.card.rarity==='Limited').length;
  const rareCount = state.collection.filter(c=>c.card.rarity==='Rare').length;
  // count unique card designs collected
  const uniqueCards = new Set(state.collection.map(c=>c.card.card.id)).size;
  return `
  <div class="topbar"><h1>My Page</h1><span></span></div>
  <div class="pad" style="padding-top:6px;">
    <div style="text-align:center;margin-bottom:18px;">
      <div style="width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));margin:0 auto 10px;"></div>
      <div style="font-weight:700;color:var(--maroon);">Darling #${1000 + state.collection.length}</div>
      <div style="font-size:11.5px;color:#a15578;">${state.collection.length} card${state.collection.length===1?'':'s'} collected · ${uniqueCards}/${CARDS.length} designs</div>
    </div>
    <div class="prod-row"><div><div class="prod-name">Common pulls</div><div class="prod-use">${commonCount} collected</div></div></div>
    <div class="prod-row"><div><div class="prod-name">Limited pulls</div><div class="prod-use">${limitedCount} collected</div></div></div>
    <div class="prod-row"><div><div class="prod-name">Rare pulls ✦</div><div class="prod-use">${rareCount} collected</div></div></div>
  </div>`;
}

/* ---------------- EVENTS ---------------- */
function wireScreenEvents(){
  document.querySelectorAll('.tab[data-tab]').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.tab; render(); };
  });
  document.querySelectorAll('.chip[data-fill]').forEach(el=>{
    el.onclick = ()=>{ document.getElementById('moodInput').value = el.dataset.fill; };
  });
  document.querySelectorAll('.lookPhotoInput').forEach(el=>{
    el.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const lookId = el.dataset.lookid;
      const reader = new FileReader();
      reader.onload = ()=>{
        state.lookPhotos[lookId] = reader.result;
        saveLookPhotos();
        toast('Photo added ✓');
        render();
      };
      reader.readAsDataURL(file);
    };
  });
  document.querySelectorAll('.remove-badge[data-removeid]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      delete state.lookPhotos[el.dataset.removeid];
      saveLookPhotos();
      toast('Reverted to illustration');
      render();
    };
  });
  const genBtn = document.getElementById('genBtn');
  if(genBtn) genBtn.onclick = ()=>{
    const val = document.getElementById('moodInput').value.trim();
    if(!val){ toast('Type a mood, moment, or song first'); return; }
    state.currentInput = val;
    state.currentLook = matchLook(val);
    state.photoDataUrl = null;
    state.customLookName = '';
    nav('result');
  };

  const tryonPhotoInput = document.getElementById('tryonPhotoInput');
  if(tryonPhotoInput) tryonPhotoInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    stopCameraStream();
    const reader = new FileReader();
    reader.onload = ()=>{ state.photoDataUrl = reader.result; state.captureWasTracked = false; render(); };
    reader.readAsDataURL(file);
  };

  const useCameraBtn = document.getElementById('useCameraBtn');
  if(useCameraBtn) useCameraBtn.onclick = startCamera;
  const camCaptureBtn = document.getElementById('camCaptureBtn');
  if(camCaptureBtn) camCaptureBtn.onclick = captureFromCamera;
  const camCancelBtn = document.getElementById('camCancelBtn');
  if(camCancelBtn) camCancelBtn.onclick = ()=>{ stopCameraStream(); render(); };

  const boothUseCameraBtn = document.getElementById('boothUseCameraBtn');
  if(boothUseCameraBtn) boothUseCameraBtn.onclick = startBoothCamera;

  const boothStartSeqBtn = document.getElementById('boothStartSeqBtn');
  if(boothStartSeqBtn) boothStartSeqBtn.onclick = runBoothSequence;

  const boothCancelBtn = document.getElementById('boothCancelBtn');
  if(boothCancelBtn) boothCancelBtn.onclick = ()=>{ stopBoothCamera(); state.shots=[]; render(); };

  const boothRetakeBtn = document.getElementById('boothRetakeBtn');
  if(boothRetakeBtn) boothRetakeBtn.onclick = ()=>{ state.shots=[]; startBoothCamera(); };

  const boothDoneBtn = document.getElementById('boothDoneBtn');
  if(boothDoneBtn) boothDoneBtn.onclick = ()=>{ if(state.shots.length){ nav('photobooth-edit'); } };

  const boothPhotoInput = document.getElementById('boothPhotoInput');
  if(boothPhotoInput) boothPhotoInput.onchange = (e)=>{
    const files = Array.from(e.target.files).slice(0,4);
    if(!files.length) return;
    let loaded = [];
    let pending = files.length;
    files.forEach((file,idx)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        loaded[idx] = reader.result;
        if(--pending === 0){
          // if fewer than 4 uploaded, repeat to fill the strip
          const filled = [];
          for(let i=0;i<4;i++){ filled.push(loaded[i % loaded.length]); }
          state.shots = filled;
          nav('photobooth-edit');
        }
      };
      reader.readAsDataURL(file);
    });
  };

  document.querySelectorAll('.sticker-opt[data-sticker]').forEach(el=>{
    el.onclick = ()=>{ state.selectedSticker = (state.selectedSticker===el.dataset.sticker) ? null : el.dataset.sticker; render(); };
  });
  const clearStickersBtn = document.getElementById('clearStickersBtn');
  if(clearStickersBtn) clearStickersBtn.onclick = ()=>{ state.placedStickers = []; render(); };

  // Tap a photo to drop the selected sticker exactly where you tapped
  document.querySelectorAll('.fs-shot.placeable[data-shotidx]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.classList && e.target.classList.contains('placed-sticker')) return; // handled below
      if(!state.selectedSticker){ toast('Pick a sticker first'); return; }
      const r = el.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * 100;
      const y = ((e.clientY - r.top) / r.height) * 100;
      state.placedStickers.push({emoji:state.selectedSticker, shot:parseInt(el.dataset.shotidx,10), x:Math.max(6,Math.min(94,x)), y:Math.max(6,Math.min(94,y))});
      render();
    };
  });
  // Tap a placed sticker to remove it
  document.querySelectorAll('.placed-sticker[data-stickeridx]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.placedStickers.splice(parseInt(el.dataset.stickeridx,10), 1);
      render();
    };
  });
  document.querySelectorAll('.bg-opt[data-bg]').forEach(el=>{
    el.onclick = ()=>{ state.selectedBg = el.dataset.bg; render(); };
  });
  const nameToggle = document.getElementById('nameToggle');
  if(nameToggle) nameToggle.onclick = ()=>{ state.nameOn = !state.nameOn; render(); };
  const lookNameInput = document.getElementById('lookNameInput');
  if(lookNameInput) lookNameInput.oninput = (e)=>{ state.customLookName = e.target.value; };

  const saveStripBtn = document.getElementById('saveStripBtn');
  if(saveStripBtn) saveStripBtn.onclick = ()=>{
    const card = pickCard();
    state.currentCard = card;
    state.cardRevealing = true;   // stays in gacha build-up until the user taps Reveal
    state.collection.push({look:state.currentLook, card, input:state.currentInput, photoDataUrl:state.photoDataUrl, shots:state.shots.slice(), selectedBg:state.selectedBg, selectedSticker:state.selectedSticker, placedStickers:state.placedStickers.slice(), nameOn:state.nameOn, customLookName:state.customLookName});
    nav('share');
  };

  const gachaTapBtn = document.getElementById('gachaTapBtn');
  if(gachaTapBtn) gachaTapBtn.onclick = ()=>{
    state.cardRevealing = false;
    render();
  };

  const igBtn = document.getElementById('igBtn');
  if(igBtn) igBtn.onclick = ()=> toast('Shared to Instagram (demo) ✦');
  const ttBtn = document.getElementById('ttBtn');
  if(ttBtn) ttBtn.onclick = ()=> toast('Shared to TikTok (demo) 🎵');
  const moreOptsBtn = document.getElementById('moreOptsBtn');
  if(moreOptsBtn) moreOptsBtn.onclick = ()=> toast('More sharing options coming soon');
  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn) saveBtn.onclick = ()=>{
    const node = document.getElementById('shareCaptureArea');
    if(window.html2canvas && node){
      html2canvas(node, {backgroundColor:'#fff4f7', scale:2}).then(canvas=>{
        const link = document.createElement('a');
        link.download = (state.currentLook.name.replace(/\s+/g,'_')) + '_PlayIt.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        toast('Saved to Gallery ✓');
      }).catch(()=> toast('Saved to Gallery ✓'));
    } else {
      toast('Saved to Gallery ✓');
    }
  };
}

function viewShare(idx){
  const c = state.collection[idx];
  state.currentLook = c.look;
  state.currentCard = c.card;
  state.cardRevealing = false;   // viewing an existing card — skip the reveal
  state.currentInput = c.input;
  state.photoDataUrl = c.photoDataUrl;
  state.shots = (c.shots && c.shots.length) ? c.shots.slice() : (c.photoDataUrl ? [c.photoDataUrl,c.photoDataUrl,c.photoDataUrl,c.photoDataUrl] : []);
  state.selectedBg = c.selectedBg;
  state.selectedSticker = c.selectedSticker;
  state.placedStickers = (c.placedStickers||[]).slice();
  state.nameOn = c.nameOn;
  state.customLookName = c.customLookName;
  nav('share');
}

function resetToHome(){
  state.currentInput = '';
  state.currentLook = null;
  state.photoDataUrl = null;
  state.shots = [];
  state.customLookName = '';
  state.cardRevealing = false;
  state.placedStickers = [];
  nav('home');
}

/* ---------------- INIT ---------------- */
render();
</script>
</body>
</html>
